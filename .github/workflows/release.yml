name: Release

# The in-app updater reads the latest stable GitHub release. A release must
# contain Kryvex-Setup-<version>-x64.exe, Kryvex-Portable-<version>-x64.exe and
# SHA256SUMS.txt; the updater rejects anything else.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check the tag matches package.json
        run: >
          node -e "const p = require('./package.json');
          if ('v' + p.version !== process.env.GITHUB_REF_NAME) {
            console.error('Tag ' + process.env.GITHUB_REF_NAME + ' does not match package version ' + p.version);
            process.exit(1);
          }"

      - name: Check the release record carries its wizard capture
        run: node scripts/check-release-record.cjs

      # The check above guards this tag only. An older record whose capture lost
      # a page or a screenshot would stay broken forever, because nothing else
      # ever opens those archives; `docs/UPDATES.md` promises this sweep, so it
      # has to run somewhere. Every record is committed by the time its tag is
      # pushed, so a failure here means a real regression, not a pending cut.
      - name: Check every older record still fits its capture
        run: node scripts/check-release-record.cjs --all

      - run: pnpm install --frozen-lockfile

      # A tag can be cut days after main was last green, so the advisories are
      # re-checked here rather than trusting the push that produced them.
      - name: Dependency advisories
        run: pnpm audit:deps

      - run: pnpm typecheck

      - run: pnpm test

      - name: Verify the one-time-code relay
        uses: ./.github/actions/verify-one-time-code

      - run: pnpm package:win

      - name: Write checksums
        run: node scripts/release-checksums.cjs

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/Kryvex-Setup-*-x64.exe
            release/Kryvex-Portable-*-x64.exe
            release/SHA256SUMS.txt

  # A release is not finished when it goes live. The README's install table and
  # history row, the record's Artifacts sizes and digests, and PROJECT_STATUS all
  # describe what people can actually download, and they can only be filled from
  # the published assets. Doing that close here is what stops it depending on
  # whoever cut the release remembering to run `pnpm release:sync` — the same
  # forgetting that left hotfix.9's Artifacts table at `recorded after the cut`
  # for four days, and which the next cut's gate now refuses outright.
  #
  # `ref: main` because the record has to be closed on the branch that carries
  # the next cut, not on the detached tag. If `main` is ever protected against
  # bot pushes this step fails loudly: run `pnpm release:sync <version>` by hand,
  # commit, and push, rather than making the job best-effort.
  docs:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # The job rebases onto main before pushing; a depth-1 clone has no
          # base to rebase onto once another push lands during the run.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Publishing the release and moving `releases/latest` are two API facts,
      # and the sync reads the second to decide whether the README's table may
      # move, so wait for them to agree rather than race the publish below.
      - name: Wait for the release to become the latest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          target="${GITHUB_REF_NAME}"
          for attempt in $(seq 1 12); do
            latest=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)
            if [ "$latest" = "$target" ]; then
              echo "releases/latest is ${target}"
              exit 0
            fi
            echo "releases/latest is '${latest:-none}', waiting for ${target} (${attempt}/12)"
            sleep 10
          done
          echo "::error::releases/latest never became ${target}"
          exit 1

      - name: Fill the four post-publish places
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/sync-published-release.cjs "${GITHUB_REF_NAME#v}"

      - name: Commit the paperwork to main
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if git diff --quiet -- README.md PROJECT_STATUS.md "docs/RELEASE_${version}.md"; then
            echo "the docs already name ${version}; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md PROJECT_STATUS.md "docs/RELEASE_${version}.md"
          git commit -q -m "Close the ${version} release paperwork"
          git pull --rebase origin main
          git push origin HEAD:main

  # The web client is the same renderer, so a tag must publish it too; it used to
  # be rebuilt by hand after each release. It runs after the Windows job so a tag
  # that fails its checks never replaces the live site.
  web:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the web client
        run: pnpm build:web

      # `gh-pages` carries only build output and a `.nojekyll` marker: a fresh
      # branch from `dist-web/`, force-pushed, so it never accumulates source,
      # secrets or stale hashed assets from an older release.
      - name: Publish the web client
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist-web
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish Kryvex Web for ${GITHUB_REF_NAME#v}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
