name: Release

# The in-app updater reads the latest stable GitHub release. A release must
# contain Kryvex-Setup-<version>-x64.exe, Kryvex-Portable-<version>-x64.exe and
# SHA256SUMS.txt; the updater rejects anything else.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check the tag matches package.json
        run: >
          node -e "const p = require('./package.json');
          if ('v' + p.version !== process.env.GITHUB_REF_NAME) {
            console.error('Tag ' + process.env.GITHUB_REF_NAME + ' does not match package version ' + p.version);
            process.exit(1);
          }"

      - name: Check the release record carries its wizard capture
        run: node scripts/check-release-record.cjs

      - run: pnpm install --frozen-lockfile

      # A tag can be cut days after main was last green, so the advisories are
      # re-checked here rather than trusting the push that produced them.
      - name: Dependency advisories
        run: pnpm audit:deps

      - run: pnpm typecheck

      - run: pnpm test

      - name: Verify the one-time-code relay
        uses: ./.github/actions/verify-one-time-code

      - run: pnpm package:win

      # Signing is off until the SignPath Foundation credentials exist, so a
      # fork, a clone and the next tag all publish exactly what they built.
      # See docs/CODE_SIGNING.md for why this is the only free route to a
      # publicly trusted signature and what the maintainer has to configure.
      - name: Detect the signing configuration
        id: signing
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if [ -n "$SIGNPATH_API_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No SIGNPATH_API_TOKEN: publishing unsigned installers, as before."
          fi

      # SignPath signs an Actions artifact rather than a file in the working
      # tree, so the installers go up unsigned and come back signed into the
      # same output directory, which is what the checksums then describe.
      - name: Upload the unsigned installers
        if: steps.signing.outputs.enabled == 'true'
        id: unsigned
        uses: actions/upload-artifact@v7
        with:
          name: kryvex-unsigned-installers
          path: |
            release/Kryvex-Setup-*-x64.exe
            release/Kryvex-Portable-*-x64.exe
          if-no-files-found: error

      # The request waits for the per-release approval the Foundation's terms
      # require, so the wait is longer than a build and it is not a hang.
      - name: Sign the installers
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: release

      # A signed build is only worth the wait if the published file is the
      # signed one, so the signature is read back off both installers here.
      - name: Verify the signed installers
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $exes = @(Get-ChildItem release/Kryvex-*-x64.exe)
          if ($exes.Count -ne 2) { throw "expected two installers, found $($exes.Count)" }
          foreach ($exe in $exes) {
            $sig = Get-AuthenticodeSignature $exe.FullName
            if ($sig.Status -ne 'Valid') { throw "$($exe.Name) is not validly signed: $($sig.Status)" }
            Write-Host "$($exe.Name) signed by $($sig.SignerCertificate.Subject)"
          }

      - name: Write checksums
        run: node scripts/release-checksums.cjs

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/Kryvex-Setup-*-x64.exe
            release/Kryvex-Portable-*-x64.exe
            release/SHA256SUMS.txt

  # The web client is the same renderer, so a tag must publish it too; it used to
  # be rebuilt by hand after each release. It runs after the Windows job so a tag
  # that fails its checks never replaces the live site.
  web:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the web client
        run: pnpm build:web

      # `gh-pages` carries only build output and a `.nojekyll` marker: a fresh
      # branch from `dist-web/`, force-pushed, so it never accumulates source,
      # secrets or stale hashed assets from an older release.
      - name: Publish the web client
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist-web
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish Kryvex Web for ${GITHUB_REF_NAME#v}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
