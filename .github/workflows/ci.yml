name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency advisories
        run: pnpm audit:deps

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build and check the web/PWA client
        run: pnpm build:web

      - name: Verify the one-time-code relay
        uses: ./.github/actions/verify-one-time-code

      # The Electron harnesses cover what none of the steps above can: they launch
      # the built app in a real window and drive it over the DevTools protocol, so
      # they exercise the built-in tools through the DOM a user sees, the shell's
      # own behaviours, and the phone companion over a live HTTP listener.
      #
      # They need the desktop build, which the web build above does not produce.
      # It is made once here and the harnesses run from its output — the same
      # commands `pnpm verify:inhouse`, `pnpm verify:shell-batch` and
      # `pnpm verify:link` run, minus a rebuild each.
      - name: Build the desktop app
        run: pnpm build

      - name: Verify the in-house services
        run: node scripts/verify-inhouse-services.cjs

      - name: Verify the shell batch
        run: node scripts/verify-shell-batch.cjs

      - name: Verify Kryvex Link
        run: node scripts/verify-link.cjs

  # The rest of the Electron harnesses, in batches.
  #
  # They all boot the built app in a disposable profile and take the same ports
  # and `.tmp-*` paths, so they cannot run beside each other; a matrix is what
  # keeps a failure in one batch from skipping the batches behind it, and every
  # batch is sized well inside the timeout. `node scripts/verify-batch.cjs
  # --list` prints the batches and, with its reasons, the harnesses held back:
  # the ones needing an installed build, a live Google page, a real screen, a
  # display, OS speech voices, a torrent peer, or a published release to update
  # from. Those keep their own aliases and stay local.
  #
  # `needs: windows` is deliberate: when the install, typecheck or unit suite is
  # the thing that broke, five more jobs would fail the same way for no new
  # information — and each failure is another notification.
  harnesses:
    name: Harnesses (${{ matrix.batch }})
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        batch: [browser, services, shell, rooms, tools]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the desktop app
        run: pnpm build

      - name: Run the ${{ matrix.batch }} batch
        run: node scripts/verify-batch.cjs ${{ matrix.batch }}
