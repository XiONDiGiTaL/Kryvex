name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      link_firewall:
        description: 'Run the firewall-scope harness, which writes and restores the Kryvex Link rule'
        type: boolean
        default: false
      signin_popup:
        description: 'Run the sign-in pop-up harness, which reaches Google and Microsoft on the internet'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency advisories
        run: pnpm audit:deps

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build and check the web/PWA client
        run: pnpm build:web

      - name: Verify the one-time-code relay
        uses: ./.github/actions/verify-one-time-code

      # The Electron harnesses cover what none of the steps above can: they launch
      # the built app in a real window and drive it over the DevTools protocol, so
      # they exercise the built-in tools through the DOM a user sees, the shell's
      # own behaviours, and the phone companion over a live HTTP listener.
      #
      # They need the desktop build, which the web build above does not produce.
      # It is made once here and the harnesses run from its output — the same
      # commands `pnpm verify:inhouse`, `pnpm verify:shell-batch` and
      # `pnpm verify:link` run, minus a rebuild each.
      - name: Build the desktop app
        run: pnpm build

      - name: Verify the in-house services
        run: node scripts/verify-inhouse-services.cjs

      - name: Verify the shell batch
        run: node scripts/verify-shell-batch.cjs

      - name: Verify Kryvex Link
        run: node scripts/verify-link.cjs

      # The other half of the sign-in harness needs the internet and is opt-in;
      # this half stays on loopback, so it runs where every push lands. It drives
      # a sign-in past the identifier field: the test account, consent, the code
      # handed back to the module, the exchange, the session and its refusals.
      - name: Verify the sign-in return leg
        run: node scripts/verify-signin-popup.cjs --local-only

  # The rest of the Electron harnesses, in batches.
  #
  # They all boot the built app in a disposable profile and take the same ports
  # and `.tmp-*` paths, so they cannot run beside each other; a matrix is what
  # keeps a failure in one batch from skipping the batches behind it, and every
  # batch is sized well inside the timeout. `node scripts/verify-batch.cjs
  # --list` prints the batches and, with its reasons, the harnesses held back:
  # the ones needing an installed build, a live Google page, a real screen, a
  # display, OS speech voices, a torrent peer, or a published release to update
  # from. Those keep their own aliases and stay local.
  #
  # `needs: windows` is deliberate: when the install, typecheck or unit suite is
  # the thing that broke, five more jobs would fail the same way for no new
  # information — and each failure is another notification.
  harnesses:
    name: Harnesses (${{ matrix.batch }})
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        batch: [browser, services, shell, rooms, tools]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the desktop app
        run: pnpm build

      - name: Run the ${{ matrix.batch }} batch
        run: node scripts/verify-batch.cjs ${{ matrix.batch }}

  # The service sign-in pop-up, against Google's and Microsoft's own pages.
  #
  # Opt-in for the same reason `scripts/verify-google-signin.cjs` stays out of
  # the push batches: it needs the internet, and a provider that rate-limits a
  # runner's address would fail a job about this repository's own code. The
  # harness still fails on a real regression: a pop-up that is refused, a window
  # that does not share the module's session, or a provider page that does not
  # render.
  signin-popup:
    name: Service sign-in pop-up
    if: github.event_name == 'workflow_dispatch' && inputs.signin_popup == true
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the desktop app
        run: pnpm build

      - name: Verify the sign-in pop-up
        run: node scripts/verify-signin-popup.cjs

  # The firewall-scope pass is opt-in, and it is the one job that changes the
  # machine it runs on: it creates the Kryvex Link rule, widens it to a named
  # network, and puts it back. That is why it is not on every push — dispatch
  # this workflow with `link_firewall` ticked to run it.
  #
  # It also answers a question the local pass cannot: whether a runner's token is
  # elevated, because the app writes the rule through `Start-Process -Verb RunAs`.
  # The harness skips (exit 0) when it is not, so a green job whose log carries
  # no PASS lines is the runner saying it could not run — which is an answer too.
  link-firewall:
    name: Link firewall scope
    if: github.event_name == 'workflow_dispatch' && inputs.link_firewall == true
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the desktop app
        run: pnpm build

      - name: Verify the firewall scope
        run: node scripts/verify-link-firewall.cjs

      # The report is the evidence, including the skip reason when it never ran.
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-firewall-report
          path: .tmp-link-firewall-report.txt
          if-no-files-found: warn
