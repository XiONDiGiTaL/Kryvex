allowBuilds:
  electron: true
  esbuild: true
  electron-winstaller: true
  # WebTorrent's WebRTC bridge; N-API binary, shared by Node and Electron.
  node-datachannel: true
  # Optional performance transports. Kryvex works without them.
  bufferutil: false
  ip-set: false
  utf-8-validate: false
  utp-native: false
